<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprint Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%238AC6CC'/></svg>">
  <style>
    :root {
      --white: #FFFFFF;
      --black: #111111;
      --paper: #FFFFFF;
      --paper-raised: #FFFFFF;
      --ink: #111111;
      --ink-soft: rgba(17, 17, 17, 0.58);
      --line: #E3E3E5;
      --intake: #F5F5F6;
      --intake-line: #E3E3E5;
      --accent: #8AC6CC;
      --accent-dark: #3F7379;
      --accent-ink: #2E5A5F;
      --danger: #111111;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Roboto', system-ui, sans-serif;
      font-size: 14px;
    }

    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 32px 60px;
    }

    header.board-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .title-block h1 {
      font-family: 'Roboto', sans-serif;
      font-weight: 700;
      font-size: 28px;
      margin: 0 0 4px;
      letter-spacing: .2px;
    }

    .sprint-label-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sprint-label {
      font-size: 14px;
      color: var(--ink-soft);
      border: none;
      background: transparent;
      font-family: inherit;
      padding: 2px 4px;
      border-radius: 4px;
      min-width: 220px;
    }

    .sprint-label:hover,
    .sprint-label:focus {
      background: var(--paper-raised);
      outline: 1px solid var(--line);
    }

    .head-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 500;
      border-radius: 8px;
      padding: 9px 16px;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--black);
    }

    .btn-primary:hover {
      background: var(--accent-dark);
      color: var(--white);
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink-soft);
      border: 1px solid var(--line);
    }

    .btn-ghost:hover {
      background: var(--paper-raised);
    }

    .sync-note {
      font-size: 12px;
      color: var(--ink-soft);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--ink-soft);
    }

    .board {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .lane {
      background: var(--paper-raised);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .lane.intake {
      background: var(--intake);
      border-color: var(--intake-line);
    }

    .lane-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
    }

    .lane.intake .lane-head {
      border-bottom-color: var(--intake-line);
    }

    .lane-name {
      font-weight: 600;
      font-size: 14px;
    }

    .lane-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .lane-count {
      font-size: 12px;
      color: var(--ink-soft);
      margin-left: 2px;
    }

    .lane-head .btn {
      margin-left: auto;
      padding: 5px 12px;
      font-size: 12.5px;
    }

    .lane-hours-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    .capacity-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--ink-soft);
      white-space: nowrap;
    }

    .capacity-wrap input {
      width: 44px;
      font-family: inherit;
      font-size: 12px;
      padding: 3px 5px;
      border-radius: 5px;
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--ink);
      text-align: right;
    }

    .hours-summary {
      font-size: 12px;
      padding: 3px 9px;
      border-radius: 100px;
      background: var(--intake);
      color: var(--accent-ink);
      font-weight: 500;
      white-space: nowrap;
    }

    .hours-summary.over {
      background: var(--black);
      color: var(--white);
    }

    .intake-hours {
      margin-left: auto;
      font-size: 12px;
      color: var(--ink-soft);
    }

    .lane-body {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 16px;
      min-height: 88px;
    }

    .lane-body.drop-target {
      background: rgba(17, 17, 17, 0.045);
    }

    .lane-body:empty::after {
      content: "No tasks yet";
      color: var(--ink-soft);
      font-size: 12.5px;
      align-self: center;
      font-style: italic;
    }

    .completed-section {
      margin-top: 20px;
    }

    .completed-head {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 8px 4px;
      user-select: none;
    }

    .completed-head .chevron {
      transition: transform .15s ease;
      color: var(--ink-soft);
      font-size: 11px;
    }

    .completed-head.collapsed .chevron {
      transform: rotate(-90deg);
    }

    .completed-head h3 {
      margin: 0;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink-soft);
    }

    .completed-body {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 6px 4px 4px;
    }

    .completed-body.hidden {
      display: none;
    }

    .card.completed-card {
      border-left-color: var(--line);
    }

    .card.completed-card .card-title {
      text-decoration: line-through;
      color: var(--ink-soft);
    }

    .card-assignee-pill {
      font-size: 11px;
      color: var(--ink-soft);
    }

    .client-section {
      background: var(--paper-raised);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 16px;
    }

    .client-head {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      padding: 12px 16px;
    }

    .client-head .chevron {
      transition: transform .15s ease;
      color: var(--ink-soft);
      font-size: 11px;
    }

    .client-head.collapsed .chevron {
      transform: rotate(-90deg);
    }

    .client-head h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }

    .client-head .btn {
      margin-left: auto;
      padding: 5px 12px;
      font-size: 12.5px;
    }

    .client-body {
      padding: 0 16px 14px;
    }

    .client-body.hidden {
      display: none;
    }

    table.client-table {
      width: 100%;
      border-collapse: collapse;
    }

    table.client-table th {
      text-align: left;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-soft);
      padding: 6px 10px;
      border-bottom: 1px solid var(--line);
    }

    table.client-table td {
      font-size: 13px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    table.client-table td[contenteditable="true"]:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
      border-radius: 4px;
    }

    table.client-table td[contenteditable="true"]:empty::before {
      content: attr(data-placeholder);
      color: var(--ink-soft);
      font-style: italic;
    }

    .client-swatch-col {
      width: 44px;
      padding: 8px 6px !important;
    }

    .client-swatch-col > div.swatch-picker,
    .client-drag-handle {
      vertical-align: middle;
    }

    .client-drag-handle {
      display: inline-block;
      cursor: grab;
      color: var(--ink-soft);
      font-size: 13px;
      margin-right: 4px;
      letter-spacing: -1px;
    }

    .swatch-picker {
      display: inline-block;
      position: relative;
    }

    .client-swatch {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(0, 0, 0, 0.15);
      cursor: pointer;
      padding: 0;
    }

    .swatch-popover {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 40;
      background: var(--paper-raised);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      box-shadow: 0 12px 32px rgba(17, 38, 40, 0.22);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      width: 168px;
    }

    .swatch-option {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.15);
      cursor: pointer;
      padding: 0;
    }

    .swatch-option:hover {
      transform: scale(1.15);
    }

    .client-name-col {
      width: 18%;
      font-weight: 500;
    }

    .client-goal-col {
      width: 38%;
    }

    .client-del-col {
      width: 28px;
    }

    .client-del-col button {
      border: none;
      background: none;
      color: var(--ink-soft);
      cursor: pointer;
      font-size: 13px;
    }

    .client-del-col button:hover {
      color: var(--black);
    }

    .card {
      flex: 0 0 240px;
      background: var(--paper-raised);
      border: 1px solid var(--line);
      border-left: 4px solid var(--card-color, var(--line));
      border-radius: 8px;
      padding: 10px 12px;
      cursor: grab;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lane.intake .card {
      background: #fff;
    }

    .card.completed {
      opacity: .55;
    }

    .card.completed .card-title {
      text-decoration: line-through;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .card-check {
      margin-top: 2px;
      flex-shrink: 0;
    }

    .card-title {
      font-weight: 600;
      font-size: 13.5px;
      line-height: 1.3;
      flex: 1;
    }

    .card-del {
      border: none;
      background: none;
      color: var(--ink-soft);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
      flex-shrink: 0;
    }

    .card-del:hover {
      color: var(--danger);
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 100px;
      background: var(--paper);
      color: var(--ink-soft);
      white-space: nowrap;
    }

    .pill.hours {
      background: var(--intake);
      color: var(--accent-ink);
      font-weight: 500;
    }

    .card-notes {
      font-size: 11.5px;
      color: var(--ink-soft);
      font-style: italic;
    }

    .card-assign {
      margin-top: 2px;
    }

    .card-assign select {
      width: 100%;
      font-size: 11.5px;
      font-family: inherit;
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
    }

    .assignee-rows {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .assignee-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .assignee-row span {
      flex: 1;
    }

    .assignee-row input[type=number] {
      width: 64px;
      font-family: inherit;
      font-size: 12.5px;
      padding: 5px 7px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
    }

    .assignee-row input[type=number]:disabled {
      opacity: .4;
    }

    /* Modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 26, 25, .42);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }

    .auth-card {
      max-width: 400px;
      padding: 40px 36px 32px;
      text-align: center;
      border-radius: 18px;
      box-shadow: 0 24px 64px rgba(17, 38, 40, 0.28);
    }

    .auth-badge {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
    }

    .auth-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .auth-card h2 {
      margin: 0 0 6px;
    }

    .auth-sub {
      margin: 0 0 26px;
      font-size: 13px;
      color: var(--ink-soft);
    }

    .auth-card .field {
      text-align: left;
    }

    .auth-card input[type=password] {
      font-size: 15px;
      padding: 11px 14px;
    }

    .auth-card input[type=password]:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    .auth-card .btn-primary {
      padding: 11px 16px;
      font-size: 14.5px;
      border-radius: 9px;
      margin-top: 4px;
    }

    .modal {
      background: var(--paper-raised);
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      padding: 22px 24px 20px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .modal h2 {
      font-family: 'Roboto', sans-serif;
      font-size: 19px;
      margin: 0 0 16px;
      font-weight: 700;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ink-soft);
      margin-bottom: 5px;
    }

    .field input[type=text],
    .field input[type=number],
    .field input[type=password],
    .field textarea {
      width: 100%;
      font-family: inherit;
      font-size: 13.5px;
      padding: 8px 10px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
    }

    .field textarea {
      resize: vertical;
      min-height: 44px;
    }

    .chip-set {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 100px;
      border: 1px solid var(--line);
      background: var(--paper);
      cursor: pointer;
      user-select: none;
    }

    .chip.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--black);
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
    }

    .modal-actions-right {
      display: flex;
      gap: 8px;
    }

    .field-error {
      color: var(--danger);
      font-weight: 600;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }

    @media (max-width:640px) {
      .wrap {
        padding: 18px 14px 40px;
      }

      header.board-head {
        flex-direction: column;
        align-items: flex-start;
      }

      .card {
        flex-basis: 200px;
      }

      /* Fix 1: let the crowded per-person row header wrap onto its own line */
      .lane-head {
        flex-wrap: wrap;
        row-gap: 6px;
      }

      .lane-hours-group {
        flex-basis: 100%;
        margin-left: 0;
        justify-content: space-between;
      }

      /* Fix 2: stack the client table into cards instead of squeezing columns */
      table.client-table thead {
        display: none;
      }

      table.client-table, table.client-table tbody, table.client-table tr, table.client-table td {
        display: block;
        width: 100% !important;
      }

      table.client-table tr {
        padding: 10px 0 12px 12px;
        margin-bottom: 6px;
        border-bottom: 1px solid var(--line);
      }

      .client-drag-handle {
        display: none;
      }

      table.client-table td {
        border-bottom: none;
        padding: 4px 0;
      }

      td[data-label]::before {
        content: attr(data-label) ": ";
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: var(--ink-soft);
        margin-bottom: 2px;
      }

      .client-del-col {
        position: absolute;
        top: 8px;
        right: 4px;
      }

      table.client-table tr {
        position: relative;
      }

      /* Fix 3: bigger tap targets for small controls */
      .card-del {
        min-width: 30px;
        min-height: 30px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }

      .card-check {
        width: 18px;
        height: 18px;
      }

      .client-del-col button {
        min-width: 32px;
        min-height: 32px;
        font-size: 15px;
      }
    }
  </style>
</head>

          <label for="authPassword">Password</label>

    <header class="board-head">
      <div class="title-block">

      </div>

        <span class="sync-note" id="syncNote">Loading…</span>
        <button class="btn btn-ghost" id="refreshBtn">Refresh</button>
        <button class="btn btn-primary" id="addBtn">+ New task</button>
      </div>
    </header>

    <div id="clientSection"></div>

    <div class="board" id="board"></div>
  </div>

  <div class="overlay" id="overlay" style="display:none;">
    <div class="modal">
      <h2 id="modalTitle">New task</h2>
      <div class="field">
        <label for="f-title">Title</label>
        <input type="text" id="f-title" placeholder="e.g. Rewrite grants landing page" />
        <div class="field-error" id="titleError">A title is required.</div>
      </div>
      <div class="field">
        <label>Client</label>
        <div class="chip-set" id="clientChips"></div>
      </div>
      <div class="field">
        <label>Assign & hours</label>
        <div class="assignee-rows" id="assigneeRows"></div>
      </div>
      <div class="field">
        <label for="f-notes">Notes / deadline</label>
        <textarea id="f-notes" placeholder="e.g. Needs to be live before the board meeting on the 18th"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="deleteBtn"
          style="display:none; color:var(--danger); border-color:var(--danger);">Delete</button>

          <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
          <button class="btn btn-primary" id="saveBtn">Save</button>
        </div>
      </div>
    </div>

  <script>
    const TEAM = ["Ambika", "Jamie", "Jenn", "Kristen", "Marie", "Miranda", "Rollo"];
    const LANE_COLORS = {
      "Ambika": "#173538", "Jamie": "#2E5A5F", "Jenn": "#3F7379",
      "Kristen": "#568D93", "Marie": "#8AC6CC", "Miranda": "#AEDBDF", "Rollo": "#111111"
    };
    const STORAGE_KEY = "sjn-sprint-board";
    const POLL_MS = 8000;

    // Paste the /exec URL from your Apps Script deployment here:
    const API_URL = "https://script.google.com/macros/s/AKfycbxQmu1xggAhSrS3QwTV0QkSRYOmrP5EIooLBm5y4wuAe4-qgeSwSKFrQXsL-UCLzrdfyw/exec";

    // Drop-in replacement for the Claude-artifact window.storage API,
    // backed by the Google Sheet via Apps Script instead. The password is
    // sent with every request; the sheet's real content never comes back
    // without it.
    let boardPassword = "";

    const storage = {
      async get(key, shared) {
        const url = API_URL + "?pw=" + encodeURIComponent(boardPassword);
        const res = await fetch(url);
        if (!res.ok) throw new Error("Fetch failed: " + res.status);
        const data = await res.json();
        if (!data.ok) throw new Error("unauthorized");
        return {key, value: data.value, shared};
      },
      async set(key, value, shared) {
        const res = await fetch(API_URL, {
          method: "POST",
          // text/plain avoids a CORS preflight that Apps Script doesn't handle
          headers: {"Content-Type": "text/plain;charset=utf-8"},
          body: JSON.stringify({pw: boardPassword, value})
        });
        if (!res.ok) return null;
        const data = await res.json();
        if (!data.ok) return null;
        return {key, value, shared};
      }
    };
    window.storage = storage;

    // Client color palette — 18 jewel tones to choose from. Each client
    // stores its own chosen color explicitly, so reordering the list
    // never shifts anyone's color.
    const CLIENT_PALETTE = [
      // red
      {bg: "#7A1F3D", text: "#FFFFFF"}, // garnet
      {bg: "#A31E34", text: "#FFFFFF"}, // ruby
      {bg: "#D1453D", text: "#FFFFFF"}, // scarlet
      // orange
      {bg: "#A65A1A", text: "#FFFFFF"}, // amber
      {bg: "#D9791F", text: "#FFFFFF"}, // topaz
      {bg: "#E8963B", text: "#111111"}, // tangerine
      // yellow
      {bg: "#B8860B", text: "#FFFFFF"}, // dark gold
      {bg: "#D4A017", text: "#111111"}, // citrine
      {bg: "#E8C547", text: "#111111"}, // lemon
      // green
      {bg: "#0E6B4C", text: "#FFFFFF"}, // emerald
      {bg: "#1F8A6F", text: "#FFFFFF"}, // jade
      {bg: "#7DAF3C", text: "#FFFFFF"}, // peridot
      // blue
      {bg: "#1D3F6E", text: "#FFFFFF"}, // sapphire
      {bg: "#2E5C99", text: "#FFFFFF"}, // lapis
      {bg: "#3E7FC4", text: "#FFFFFF"}, // sky sapphire
      // purple
      {bg: "#453983", text: "#FFFFFF"}, // iolite
      {bg: "#6A2C91", text: "#FFFFFF"}, // amethyst
      {bg: "#9B5FC0", text: "#FFFFFF"}  // orchid
    ];

    function paletteColorFor(index) {
      return CLIENT_PALETTE[index % CLIENT_PALETTE.length];
    }

    // Which client's color picker (if any) is currently open
    let openColorPickerFor = null;
    // Client currently being drag-reordered
    let dragClientId = null;

    const SEED_CLIENTS = [
      {
        name: "ACT", theirGoal: "To be better communicators for their work and communities.",
        ourGoal: "To get a phase 2 that would help us push forward participatory mapping."
      },
      {
        name: "Archstone", theirGoal: "Archstone wants to find the mechanisms that galvanize older adults to recognize their political power.",
        ourGoal: "Develop narratives for policy and political change."
      },
      {
        name: "Bana Pele", theirGoal: "Bana Pele wants the government of South Africa to be behind their work. SIL is there to create the compelling narrative.",
        ourGoal: ""
      },
      {
        name: "Enlight", theirGoal: "Enlight wants funders in the youth mental health space to vet and increase the programmatic capacity of their grantees.",
        ourGoal: "Build awesome materials for funders that we can show other potential clients (current priority). We want to have policy change to demonstrate our impact (in progress). We want to show that we can bring people together, e.g. practioners in working groups (done!)."
      },
      {
        name: "ERC", theirGoal: "ERC wants to showcase impact of the fellowship to funders so they can get more funding for the program. [TBD - How important are the partners in the ecosystems? Our research shows they are not integral.]",
        ourGoal: "Produce something public-facing, so that we can get a renewal."
      },
      {
        name: "IKEA Comms", theirGoal: "To show philanthropies CAN and SHOULD do public campaigns to bring more narrative power to work.",
        ourGoal: "To be THE point person for bringing voice to a campaign via written, visual, and interviews."
      },
      {name: "Levers for Change", theirGoal: "", ourGoal: ""},
      {
        name: "LIF", theirGoal: "To raise momentum around the new Vision Action Fund",
        ourGoal: "To produce funder facing media, and lead on media buys."
      },
      {
        name: "NEID", theirGoal: "NEID wants to be a convener in the sector. They want to see retreat participants deciding to convene/cofund afterwards. SIL is there to create the container for that.",
        ourGoal: "Build SIL's reputation among funders in the NEID network."
      },
      {name: "Rippel", theirGoal: "", ourGoal: ""}
    ];

    let state = {sprintLabel: "", tickets: [], capacities: {}, clients: [], clientsSeeded: false};
    let editingId = null; // null = new ticket
    let saving = false;
    let dragTicketId = null;
    let completedCollapsed = false;
    let clientsCollapsed = false;
    let inlineEditing = false;

    const boardEl = document.getElementById("board");
    const syncNote = document.getElementById("syncNote");
    const overlay = document.getElementById("overlay");
    const sprintLabelInput = document.getElementById("sprintLabel");

    function uid() {return "t_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);}

    function laneList() {
      return [{key: null, name: "New tasks", intake: true}].concat(
        TEAM.map(n => ({key: n, name: n, intake: false}))
      );
    }

    function findClientByName(name) {
      if (!name) return null;
      const norm = name.trim().toLowerCase();
      if (!norm) return null;
      return state.clients.find(c => c.name && c.name.trim().toLowerCase() === norm) || null;
    }

    async function loadState(showLoading) {
      if (showLoading) syncNote.textContent = "Loading…";
      let needsSave = false;
      try {
        const res = await window.storage.get(STORAGE_KEY, true);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          state = {
            sprintLabel: parsed.sprintLabel || "", tickets: parsed.tickets || [],
            capacities: parsed.capacities || {}, clients: parsed.clients || [],
            clientsSeeded: !!parsed.clientsSeeded
          };
        }
        syncNote.textContent = "Synced " + new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
      } catch (e) {
        // key not found yet is normal on first run
        syncNote.textContent = "Synced " + new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
      }
      if (!state.clientsSeeded && state.clients.length === 0) {
        state.clients = SEED_CLIENTS.map((c, i) => {
          const p = paletteColorFor(i);
          return {id: uid(), name: c.name, theirGoal: c.theirGoal, ourGoal: c.ourGoal, color: p.bg, textColor: p.text};
        });
        state.clientsSeeded = true;
        needsSave = true;
      }
      // Backfill colors for any client saved before color selection existed
      state.clients.forEach((c, i) => {
        if (!c.color) {
          const p = paletteColorFor(i);
          c.color = p.bg; c.textColor = p.text;
          needsSave = true;
        }
      });
      // Migrate tasks from the old single-assignee model (assignee + hours)
      // to multi-assignee with hours allocated per person.
      state.tickets.forEach(t => {
        if (!t.assignments) {
          t.assignments = t.assignee ? [{name: t.assignee, hours: t.hours ?? ""}] : [];
          delete t.assignee;
          delete t.hours;
          needsSave = true;
        }
      });
      sprintLabelInput.value = state.sprintLabel;
      render();
      if (needsSave) saveState();
    }

    async function saveState() {
      saving = true;
      syncNote.textContent = "Saving…";
      try {
        const result = await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
        if (!result) {syncNote.textContent = "Save failed — check connection";}
        else {syncNote.textContent = "Saved " + new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});}
      } catch (e) {
        syncNote.textContent = "Save failed — check connection";
      }
      saving = false;
    }

    function render() {
      renderClientsSection();
      boardEl.innerHTML = "";
      laneList().forEach(lane => {
        const laneTickets = lane.intake
          ? state.tickets.filter(t => (t.assignments || []).length === 0 && !t.completed)
          : state.tickets.filter(t => assignmentFor(t, lane.name) && !t.completed);
        const laneEl = document.createElement("div");
        laneEl.className = "lane" + (lane.intake ? " intake" : "");

        const head = document.createElement("div");
        head.className = "lane-head";
        if (!lane.intake) {
          const dot = document.createElement("span");
          dot.className = "lane-dot";
          dot.style.background = LANE_COLORS[lane.name];
          head.appendChild(dot);
        }
        const nameEl = document.createElement("span");
        nameEl.className = "lane-name";
        nameEl.textContent = lane.name;
        head.appendChild(nameEl);
        const countEl = document.createElement("span");
        countEl.className = "lane-count";
        countEl.textContent = laneTickets.length ? "· " + laneTickets.length : "";
        head.appendChild(countEl);
        if (lane.intake) {
          const addBtn = document.createElement("button");
          addBtn.className = "btn btn-primary";
          addBtn.textContent = "+ Add";
          addBtn.onclick = () => openModal(null);
          head.appendChild(addBtn);
        } else {
          const capWrap = document.createElement("div");
          capWrap.className = "capacity-wrap";
          const capInput = document.createElement("input");
          capInput.type = "number"; capInput.min = "0"; capInput.step = "0.5";
          capInput.placeholder = "hrs";
          capInput.value = state.capacities[lane.name] ?? "";
          capInput.title = "Available hours for this sprint";
          capInput.onchange = () => {
            state.capacities[lane.name] = capInput.value === "" ? "" : Number(capInput.value);
            render(); saveState();
          };
          capWrap.appendChild(document.createTextNode("Available hours:"));
          capWrap.appendChild(capInput);

          const assignedAll = personTotalHours(lane.name);
          const cap = state.capacities[lane.name];
          const summary = document.createElement("span");
          const hasCap = cap !== "" && cap !== undefined && cap !== null;
          summary.className = "hours-summary" + (hasCap && assignedAll > Number(cap) ? " over" : "");
          summary.textContent = hasCap ? ("Assigned: " + assignedAll + " / " + cap + "h") : ("Assigned: " + assignedAll + "h");
          summary.title = "Total hours assigned this sprint, including completed work";

          const hoursGroup = document.createElement("div");
          hoursGroup.className = "lane-hours-group";
          hoursGroup.appendChild(capWrap);
          hoursGroup.appendChild(summary);
          head.appendChild(hoursGroup);
        }
        laneEl.appendChild(head);

        const body = document.createElement("div");
        body.className = "lane-body";
        body.dataset.laneKey = lane.key === null ? "" : lane.key;
        body.addEventListener("dragover", e => {e.preventDefault(); body.classList.add("drop-target");});
        body.addEventListener("dragleave", () => body.classList.remove("drop-target"));
        body.addEventListener("drop", e => {
          e.preventDefault();
          body.classList.remove("drop-target");
          if (dragTicketId) {
            if (lane.intake) {
              unassignAll(dragTicketId);
            } else {
              addAssignee(dragTicketId, lane.name);
            }
            dragTicketId = null;
          }
        });

        laneTickets.forEach(t => body.appendChild(renderCard(t, lane)));
        laneEl.appendChild(body);
        boardEl.appendChild(laneEl);
      });

      renderCompletedSection();
    }

    function renderCompletedSection() {
      const existing = document.getElementById("completedSection");
      if (existing) existing.remove();

      const completedTickets = state.tickets.filter(t => t.completed);
      const section = document.createElement("div");
      section.className = "completed-section";
      section.id = "completedSection";

      const head = document.createElement("div");
      head.className = "completed-head" + (completedCollapsed ? " collapsed" : "");
      head.innerHTML = '<span class="chevron">▾</span><h3>Completed · ' + completedTickets.length + '</h3>';
      head.onclick = () => {completedCollapsed = !completedCollapsed; render();};
      section.appendChild(head);

      const body = document.createElement("div");
      body.className = "completed-body" + (completedCollapsed ? " hidden" : "");
      completedTickets.forEach(t => {
        body.appendChild(renderCard(t, null, true));
      });
      section.appendChild(body);
      boardEl.appendChild(section);
    }

    function renderCard(t, lane, inCompletedSection) {
      const card = document.createElement("div");
      card.className = "card" + (inCompletedSection ? " completed-card" : "");
      const clientMatch = findClientByName(t.client);
      if (clientMatch && clientMatch.color) {
        card.style.setProperty("--card-color", clientMatch.color);
        card.style.background = "color-mix(in srgb, " + clientMatch.color + " 16%, white)";
      } else {
        card.style.setProperty("--card-color", "var(--line)");
      }
      card.draggable = true;
      card.addEventListener("dragstart", () => {dragTicketId = t.id;});
      card.onclick = () => openModal(t.id);

      const top = document.createElement("div");
      top.className = "card-top";
      const check = document.createElement("input");
      check.type = "checkbox";
      check.className = "card-check";
      check.checked = !!t.completed;
      check.title = "Mark complete";
      check.onclick = (e) => {e.stopPropagation(); toggleComplete(t.id);};
      top.appendChild(check);

      const titleEl = document.createElement("div");
      titleEl.className = "card-title";
      titleEl.textContent = t.title;
      top.appendChild(titleEl);

      const del = document.createElement("button");
      del.className = "card-del";
      del.textContent = "✕";
      del.title = "Delete";
      del.onclick = (e) => {e.stopPropagation(); deleteTicket(t.id);};
      top.appendChild(del);
      card.appendChild(top);

      const meta = document.createElement("div");
      meta.className = "card-meta";
      if (t.client) {
        const p = document.createElement("span");
        p.className = "pill";
        p.textContent = t.client;
        if (clientMatch && clientMatch.color) {
          p.style.background = clientMatch.color;
          p.style.color = clientMatch.textColor;
        }
        meta.appendChild(p);
      }

      const assignments = t.assignments || [];
      let hoursLabel = "";
      if (inCompletedSection) {
        const total = assignments.reduce((s, a) => s + (Number(a.hours) || 0), 0);
        if (total > 0) hoursLabel = total + "h";
      } else if (lane && !lane.intake) {
        const mine = assignmentFor(t, lane.name);
        if (mine && mine.hours !== "" && mine.hours !== null && mine.hours !== undefined) {
          hoursLabel = mine.hours + "h";
        }
      }
      if (hoursLabel) {
        const p = document.createElement("span"); p.className = "pill hours"; p.textContent = hoursLabel; meta.appendChild(p);
      }
      card.appendChild(meta);

      if (inCompletedSection) {
        const who = document.createElement("div");
        who.className = "card-assignee-pill";
        who.textContent = assignments.length
          ? "Was assigned: " + assignments.map(a => a.name + (a.hours ? " (" + a.hours + "h)" : "")).join(", ")
          : "Was unassigned";
        card.appendChild(who);
      } else if (lane && !lane.intake && assignments.length > 1) {
        const others = assignments.filter(a => a.name !== lane.name);
        if (others.length) {
          const also = document.createElement("div");
          also.className = "card-assignee-pill";
          also.textContent = "Also: " + others.map(a => a.name + (a.hours ? " (" + a.hours + "h)" : "")).join(", ");
          card.appendChild(also);
        }
      }

      if (t.notes) {
        const n = document.createElement("div");
        n.className = "card-notes";
        n.textContent = t.notes;
        card.appendChild(n);
      }

      return card;
    }

    function renderClientsSection() {
      const container = document.getElementById("clientSection");
      container.innerHTML = "";

      const section = document.createElement("div");
      section.className = "client-section";

      const head = document.createElement("div");
      head.className = "client-head" + (clientsCollapsed ? " collapsed" : "");
      head.innerHTML = '<span class="chevron">▾</span><h3>Client context</h3>';
      head.onclick = (e) => {
        if (e.target.closest(".btn")) return;
        clientsCollapsed = !clientsCollapsed; render();
      };
      const addBtn = document.createElement("button");
      addBtn.className = "btn btn-ghost";
      addBtn.textContent = "+ Add client";
      addBtn.onclick = (e) => {
        e.stopPropagation();
        const p = paletteColorFor(state.clients.length);
        state.clients.push({id: uid(), name: "", ourGoal: "", theirGoal: "", color: p.bg, textColor: p.text});
        clientsCollapsed = false;
        render(); saveState();
        const rows = document.querySelectorAll(".client-name-col");
        if (rows.length) rows[rows.length - 1].focus();
      };
      head.appendChild(addBtn);
      section.appendChild(head);

      const body = document.createElement("div");
      body.className = "client-body" + (clientsCollapsed ? " hidden" : "");

      const table = document.createElement("table");
      table.className = "client-table";
      table.innerHTML = '<thead><tr><th></th><th>Client</th><th>Client goal</th><th>SIL goal</th><th></th></tr></thead>';
      const tbody = document.createElement("tbody");

      if (state.clients.length === 0) {
        const tr = document.createElement("tr");
        tr.innerHTML = '<td colspan="5" style="color:var(--ink-soft); font-style:italic;">No clients added yet</td>';
        tbody.appendChild(tr);
      }

      state.clients.forEach(c => {
        const tr = document.createElement("tr");
        tr.dataset.clientId = c.id;
        tr.style.borderLeft = "4px solid " + (c.color || "#D8D8D8");
        tr.draggable = true;
        tr.addEventListener("dragstart", (e) => {
          dragClientId = c.id;
          e.dataTransfer.effectAllowed = "move";
        });
        tr.addEventListener("dragover", (e) => { e.preventDefault(); });
        tr.addEventListener("drop", (e) => {
          e.preventDefault();
          if (dragClientId && dragClientId !== c.id) {
            const fromIdx = state.clients.findIndex(x => x.id === dragClientId);
            const toIdx = state.clients.findIndex(x => x.id === c.id);
            if (fromIdx > -1 && toIdx > -1) {
              const [moved] = state.clients.splice(fromIdx, 1);
              state.clients.splice(toIdx, 0, moved);
              render(); saveState();
            }
          }
          dragClientId = null;
        });

        const swatchTd = document.createElement("td");
        swatchTd.className = "client-swatch-col";

        const handle = document.createElement("span");
        handle.className = "client-drag-handle";
        handle.textContent = "⋮⋮";
        handle.title = "Drag to reorder";
        swatchTd.appendChild(handle);

        const pickerWrap = document.createElement("div");
        pickerWrap.className = "swatch-picker";
        pickerWrap.draggable = false;
        const swatch = document.createElement("button");
        swatch.type = "button";
        swatch.className = "client-swatch";
        swatch.title = "Change color";
        swatch.style.background = c.color || "#D8D8D8";
        swatch.onclick = (e) => {
          e.stopPropagation();
          openColorPickerFor = (openColorPickerFor === c.id) ? null : c.id;
          render();
        };
        pickerWrap.appendChild(swatch);

        if (openColorPickerFor === c.id) {
          const popover = document.createElement("div");
          popover.className = "swatch-popover";
          popover.onclick = (e) => e.stopPropagation();
          CLIENT_PALETTE.forEach(p => {
            const opt = document.createElement("button");
            opt.type = "button";
            opt.className = "swatch-option";
            opt.style.background = p.bg;
            opt.title = p.bg;
            opt.onclick = () => {
              c.color = p.bg; c.textColor = p.text;
              openColorPickerFor = null;
              render(); saveState();
            };
            popover.appendChild(opt);
          });
          pickerWrap.appendChild(popover);
        }
        swatchTd.appendChild(pickerWrap);
        tr.appendChild(swatchTd);

        const nameTd = document.createElement("td");
        nameTd.className = "client-name-col";
        nameTd.contentEditable = "true";
        nameTd.draggable = false;
        nameTd.dataset.placeholder = "Client name";
        nameTd.dataset.label = "Client";
        nameTd.textContent = c.name;
        nameTd.onblur = () => {c.name = nameTd.textContent.trim(); inlineEditing = false; saveState(); render();};
        nameTd.onfocus = () => {inlineEditing = true;};
        tr.appendChild(nameTd);

        const theirTd = document.createElement("td");
        theirTd.className = "client-goal-col";
        theirTd.contentEditable = "true";
        theirTd.draggable = false;
        theirTd.dataset.placeholder = "What does the client want?";
        theirTd.dataset.label = "Client goal";
        theirTd.textContent = c.theirGoal;
        theirTd.onblur = () => {c.theirGoal = theirTd.textContent.trim(); inlineEditing = false; saveState();};
        theirTd.onfocus = () => {inlineEditing = true;};
        tr.appendChild(theirTd);

        const ourTd = document.createElement("td");
        ourTd.className = "client-goal-col";
        ourTd.contentEditable = "true";
        ourTd.draggable = false;
        ourTd.dataset.placeholder = "What do we want?";
        ourTd.dataset.label = "SIL goal";
        ourTd.textContent = c.ourGoal;
        ourTd.onblur = () => {c.ourGoal = ourTd.textContent.trim(); inlineEditing = false; saveState();};
        ourTd.onfocus = () => {inlineEditing = true;};
        tr.appendChild(ourTd);

        const delTd = document.createElement("td");
        delTd.className = "client-del-col";
        delTd.draggable = false;
        const delBtn = document.createElement("button");
        delBtn.textContent = "✕";
        delBtn.title = "Remove client";
        delBtn.onclick = () => {
          if (!confirm("Remove this client from the list?")) return;
          state.clients = state.clients.filter(x => x.id !== c.id);
          render(); saveState();
        };
        delTd.appendChild(delBtn);
        tr.appendChild(delTd);

        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      body.appendChild(table);
      section.appendChild(body);
      container.appendChild(section);
    }

    function findTicket(id) {return state.tickets.find(t => t.id === id);}

    function assignmentFor(t, name) {
      return (t.assignments || []).find(a => a.name === name) || null;
    }

    function personTotalHours(name) {
      let sum = 0;
      state.tickets.forEach(t => {
        const a = assignmentFor(t, name);
        if (a) sum += Number(a.hours) || 0;
      });
      return sum;
    }

    function toggleComplete(id) {
      const t = findTicket(id); if (!t) return;
      t.completed = !t.completed;
      render(); saveState();
    }

    function addAssignee(id, name) {
      const t = findTicket(id); if (!t) return;
      if (!t.assignments) t.assignments = [];
      if (!t.assignments.some(a => a.name === name)) {
        t.assignments.push({name, hours: ""});
        render(); saveState();
      }
    }

    function unassignAll(id) {
      const t = findTicket(id); if (!t) return;
      t.assignments = [];
      render(); saveState();
    }

    function deleteTicket(id) {
      if (!confirm("Delete this task? This can't be undone.")) return;
      state.tickets = state.tickets.filter(t => t.id !== id);
      render(); saveState();
    }

    // Modal handling
    const modalTitle = document.getElementById("modalTitle");
    const fTitle = document.getElementById("f-title");
    const fNotes = document.getElementById("f-notes");
    const clientChipsEl = document.getElementById("clientChips");
    const assigneeRowsEl = document.getElementById("assigneeRows");
    const deleteBtn = document.getElementById("deleteBtn");
    const titleError = document.getElementById("titleError");
    let selectedClient = null;
    let selectedAssignments = {}; // { personName: hoursString }

    function buildChips() {
      clientChipsEl.innerHTML = "";
      if (state.clients.length === 0) {
        const hint = document.createElement("span");
        hint.style.fontSize = "12px";
        hint.style.color = "var(--ink-soft)";
        hint.style.fontStyle = "italic";
        hint.textContent = "Add clients in the Client context section above first";
        clientChipsEl.appendChild(hint);
        return;
      }
      state.clients.forEach(c => {
        if (!c.name) return;
        const chip = document.createElement("span");
        chip.className = "chip" + (selectedClient === c.name ? " selected" : "");
        chip.textContent = c.name;
        chip.onclick = () => {
          selectedClient = (selectedClient === c.name) ? null : c.name;
          buildChips();
        };
        clientChipsEl.appendChild(chip);
      });
    }

    function buildAssigneeRows() {
      assigneeRowsEl.innerHTML = "";
      TEAM.forEach(name => {
        const row = document.createElement("label");
        row.className = "assignee-row";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = Object.prototype.hasOwnProperty.call(selectedAssignments, name);

        const nameSpan = document.createElement("span");
        nameSpan.textContent = name;

        const hoursInput = document.createElement("input");
        hoursInput.type = "number"; hoursInput.min = "0"; hoursInput.step = "0.5";
        hoursInput.placeholder = "hrs";
        hoursInput.disabled = !checkbox.checked;
        hoursInput.value = selectedAssignments[name] ?? "";
        hoursInput.onclick = (e) => e.stopPropagation();
        hoursInput.onchange = () => {
          selectedAssignments[name] = hoursInput.value;
        };

        checkbox.onchange = () => {
          if (checkbox.checked) {
            selectedAssignments[name] = "";
            hoursInput.disabled = false;
            hoursInput.focus();
          } else {
            delete selectedAssignments[name];
            hoursInput.disabled = true;
            hoursInput.value = "";
          }
        };

        row.appendChild(checkbox);
        row.appendChild(nameSpan);
        row.appendChild(hoursInput);
        assigneeRowsEl.appendChild(row);
      });
    }

    function openModal(id) {
      editingId = id;
      titleError.style.display = "none";
      if (id) {
        const t = findTicket(id);
        modalTitle.textContent = "Edit task";
        fTitle.value = t.title;
        fNotes.value = t.notes || "";
        selectedClient = t.client || null;
        selectedAssignments = {};
        (t.assignments || []).forEach(a => {selectedAssignments[a.name] = a.hours ?? "";});
        deleteBtn.style.display = "inline-block";
      } else {
        modalTitle.textContent = "New task";
        fTitle.value = ""; fNotes.value = "";
        selectedClient = null;
        selectedAssignments = {};
        deleteBtn.style.display = "none";
      }
      buildChips();
      buildAssigneeRows();
      overlay.style.display = "flex";
      fTitle.focus();
    }

    function closeModal() {overlay.style.display = "none"; editingId = null;}

    document.getElementById("addBtn").onclick = () => openModal(null);
    document.getElementById("cancelBtn").onclick = closeModal;
    overlay.addEventListener("click", (e) => {if (e.target === overlay) closeModal();});

    deleteBtn.onclick = () => {
      if (editingId) {closeModal(); deleteTicket(editingId);}
    };

    document.getElementById("saveBtn").onclick = () => {
      const title = fTitle.value.trim();
      if (!title) {titleError.style.display = "block"; return;}
      const assignments = Object.entries(selectedAssignments).map(([name, hours]) => ({
        name, hours: hours === "" ? "" : Number(hours)
      }));
      if (editingId) {
        const t = findTicket(editingId);
        t.title = title; t.client = selectedClient || "";
        t.notes = fNotes.value.trim(); t.assignments = assignments;
      } else {
        state.tickets.push({
          id: uid(), title, client: selectedClient || "",
          notes: fNotes.value.trim(), assignments,
          completed: false
        });
      }
      closeModal(); render(); saveState();
    };

    sprintLabelInput.addEventListener("change", () => {
      state.sprintLabel = sprintLabelInput.value;
      saveState();
    });

    document.getElementById("refreshBtn").onclick = () => loadState(true);

    document.addEventListener("click", (e) => {
      if (openColorPickerFor !== null && !e.target.closest(".swatch-picker")) {
        openColorPickerFor = null;
        render();
      }
    });

    // Poll for teammates' changes
    function startApp() {
      loadState(true);
      setInterval(() => {if (!saving && !inlineEditing && openColorPickerFor === null && overlay.style.display === "none") loadState(false);}, POLL_MS);
    }

    async function tryAuth(pw) {
      boardPassword = pw;
      try {
        const res = await fetch(API_URL + "?pw=" + encodeURIComponent(pw));
        const data = await res.json();
        return !!(data && data.ok);
      } catch (e) {
        return false;
      }
    }

    async function initAuth() {
      const authOverlay = document.getElementById("authOverlay");
      const authForm = document.getElementById("authForm");
      const authInput = document.getElementById("authPassword");
      const authError = document.getElementById("authError");
      const authSubmit = document.getElementById("authSubmit");

      const saved = sessionStorage.getItem("sprintBoardPassword");
      if (saved) {
        const ok = await tryAuth(saved);
        if (ok) {startApp(); return;}
        sessionStorage.removeItem("sprintBoardPassword");
      }

      authOverlay.style.display = "flex";
      authInput.focus();

      authForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        authError.style.display = "none";
        authSubmit.disabled = true;
        authSubmit.textContent = "Checking…";
        const ok = await tryAuth(authInput.value);
        if (ok) {
          sessionStorage.setItem("sprintBoardPassword", authInput.value);
          authOverlay.style.display = "none";
          startApp();
        } else {
          authError.style.display = "block";
          authSubmit.disabled = false;
          authSubmit.textContent = "Enter";
        }
      });
    }

    initAuth();
  </script>
</body>

</html>
